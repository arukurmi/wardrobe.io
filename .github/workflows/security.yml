name: security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    name: audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      # Non-blocking: report advisories without failing the PR.
      - name: Audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      # Only the server package defines a test script.
      - name: Test (server only)
        if: matrix.package == 'server'
        run: npm test
